services:
  caddy:
    image: caddy:2-alpine
    container_name: resource_manager_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    build: ./backend
    container_name: resource_manager_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ALLOWED_ORIGINS=https://planning.goodenough.to,http://localhost
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: resource_manager_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: resource_manager_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-resource_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
