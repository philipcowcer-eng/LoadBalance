version: '3.8'

services:
  backend:
    build: ./backend
    container_name: resource_manager_backend
    restart: always
    environment:
      # Use the host IP for Postgres connectivity
      - DATABASE_URL=postgresql://postgres:password@192.168.68.72:5432/resource_manager
      - ALLOWED_ORIGINS=http://localhost,http://192.168.68.72
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: resource_manager_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

# Note: We rely on the external Postgres instance (rm-postgres) running on the host.
